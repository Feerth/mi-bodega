<h2 class="mb-3">{{ id() ? 'Editar producto' : 'Nuevo producto' }}</h2>

@if (error()) {
  <div class="alert alert-danger">{{ error() }}</div>
}

<form [formGroup]="form" (ngSubmit)="guardar()" class="col-md-6" novalidate>
  <div class="mb-3">
    <label class="form-label" for="nombre">Nombre</label>
    <input id="nombre" class="form-control" formControlName="nombre"
           [class.is-invalid]="invalido('nombre')">
    <div class="invalid-feedback">Ingresa al menos 3 caracteres.</div>
  </div>

  <div class="mb-3">
    <label class="form-label" for="categoria">Categoría</label>
    <select id="categoria" class="form-select" formControlName="categoria"
            [class.is-invalid]="invalido('categoria')">
      <option value="">Selecciona...</option>
      @for (c of categorias; track c) {
        <option [value]="c">{{ c }}</option>
      }
    </select>
    <div class="invalid-feedback">Selecciona una categoría.</div>
  </div>

  <div class="row">
    <div class="col mb-3">
      <label class="form-label" for="precio">Precio (S/)</label>
      <input id="precio" type="number" step="0.1" class="form-control"
             formControlName="precio" [class.is-invalid]="invalido('precio')">
      <div class="invalid-feedback">El precio debe ser mayor que 0.</div>
    </div>
    <div class="col mb-3">
      <label class="form-label" for="stock">Stock</label>
      <input id="stock" type="number" class="form-control"
             formControlName="stock" [class.is-invalid]="invalido('stock')">
      <div class="invalid-feedback">El stock no puede ser negativo.</div>
    </div>
  </div>

  <button type="submit" class="btn btn-danger" [disabled]="guardando()">
    {{ guardando() ? 'Guardando...' : 'Guardar' }}
  </button>
  <a class="btn btn-link" routerLink="/productos">Cancelar</a>
</form>
